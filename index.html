<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Propuestas para Emprende Verde</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600&family=DM+Mono&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#050505;font-family:'Space Grotesk',sans-serif}

/* TOP BAR */
.top-bar{
  position:fixed;top:0;left:0;right:0;height:48px;
  background:rgba(5,5,5,0.94);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid rgba(255,255,255,0.06);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 18px;z-index:300;
}
.top-name{font-size:13px;font-weight:600;color:rgba(255,255,255,0.88);letter-spacing:-0.2px;transition:opacity .25s}
.top-num{font-family:'DM Mono',monospace;font-size:11px;color:rgba(255,255,255,0.28);letter-spacing:1.5px}

/* SWIPER */
.swiper{position:fixed;top:48px;bottom:52px;left:0;right:0;overflow:hidden}

.track{
  display:flex;
  width:600vw;
  height:100%;
  will-change:transform;
  transition:transform .38s cubic-bezier(.25,.46,.45,.94);
}

.slide{width:100vw;height:100%;flex-shrink:0;position:relative}
.slide iframe{width:100%;height:100%;border:none;display:block}

/* Loader inside slide */
.loader{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:#050505;
  font-family:'DM Mono',monospace;font-size:11px;letter-spacing:2.5px;
  color:rgba(0,255,136,0.3);pointer-events:none;
  transition:opacity .5s;z-index:2;
}
.loader.gone{opacity:0;pointer-events:none}

/* BOTTOM NAV */
.bot-nav{
  position:fixed;bottom:0;left:0;right:0;height:52px;
  background:rgba(5,5,5,0.94);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-top:1px solid rgba(255,255,255,0.06);
  display:flex;align-items:center;justify-content:center;
  gap:12px;z-index:300;padding:0 16px;
}

.nav-btn{
  background:rgba(255,255,255,0.04);
  border:1px solid rgba(255,255,255,0.1);
  color:rgba(255,255,255,0.35);
  width:34px;height:34px;border-radius:50%;
  font-size:18px;cursor:pointer;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  transition:all .2s;user-select:none;-webkit-tap-highlight-color:transparent;
}
.nav-btn:hover,.nav-btn:active{border-color:var(--accent,#00ff88);color:var(--accent,#00ff88);background:rgba(0,255,136,.08)}

.dots{display:flex;gap:7px;align-items:center;flex:1;justify-content:center}
.dot{
  width:6px;height:6px;border-radius:50%;
  background:rgba(255,255,255,0.14);
  cursor:pointer;transition:all .35s cubic-bezier(.25,.46,.45,.94);
  -webkit-tap-highlight-color:transparent;
}
.dot.active{width:22px;border-radius:3px;background:#00ff88}

/* EDGE swipe zones */
.edge{
  position:fixed;top:48px;bottom:52px;width:16%;z-index:200;
  /* completely transparent — only catches touch events */
}
.edge-l{left:0}
.edge-r{right:0}

/* Swipe hint arrows that fade out */
.hint{
  position:fixed;top:50%;transform:translateY(-50%);
  font-size:28px;color:rgba(255,255,255,0.12);
  pointer-events:none;z-index:150;transition:opacity 1s;
  font-family:monospace;
}
.hint-l{left:6px}
.hint-r{right:6px}
.hint.hidden{opacity:0}
</style>
</head>
<body>

<!-- TOP BAR -->
<div class="top-bar">
  <span class="top-name" id="pname">Calentadores Solares</span>
  <span class="top-num" id="pnum">01 / 06</span>
</div>

<!-- SWIPER -->
<div class="swiper">
  <div class="track" id="track">

    <div class="slide">
      <div class="loader" id="l0">CARGANDO</div>
      <iframe src="pitch1_solar_heater.html" title="Calentadores Solares" onload="done(0)"></iframe>
    </div>

    <div class="slide">
      <div class="loader" id="l1">CARGANDO</div>
      <iframe src="pitch2_ac_water.html" title="Agua del Aire" loading="lazy" onload="done(1)"></iframe>
    </div>

    <div class="slide">
      <div class="loader" id="l2">CARGANDO</div>
      <iframe src="pitch3_vermicompost.html" title="Vermicompostaje" loading="lazy" onload="done(2)"></iframe>
    </div>

    <div class="slide">
      <div class="loader" id="l3">CARGANDO</div>
      <iframe src="pitch4_solar_dryer.html" title="Secadores Solares" loading="lazy" onload="done(3)"></iframe>
    </div>

    <div class="slide">
      <div class="loader" id="l4">CARGANDO</div>
      <iframe src="pitch5_aquaponics.html" title="Acuaponía" loading="lazy" onload="done(4)"></iframe>
    </div>

    <div class="slide">
      <div class="loader" id="l5">CARGANDO</div>
      <iframe src="pitch6_biodigester.html" title="Biodigestores" loading="lazy" onload="done(5)"></iframe>
    </div>

  </div>

  <!-- Transparent edge swipe zones -->
  <div class="edge edge-l" id="el"></div>
  <div class="edge edge-r" id="er"></div>

  <!-- Subtle swipe hints (fade after first swipe) -->
  <div class="hint hint-l" id="hl">‹</div>
  <div class="hint hint-r" id="hr">›</div>
</div>

<!-- BOTTOM NAV -->
<div class="bot-nav" id="bot">
  <button class="nav-btn" id="bprev" aria-label="Anterior">‹</button>
  <div class="dots" id="dots-wrap"></div>
  <button class="nav-btn" id="bnext" aria-label="Siguiente">›</button>
</div>

<script>
const N = 6;
const NAMES  = ['Calentadores Solares','Agua del Aire','Vermicompostaje','Secadores Solares','Acuaponía','Biodigestores'];
const NUMS   = ['01','02','03','04','05','06'];
const COLORS = ['#00ff88','#00d4aa','#50dc3c','#c8e600','#00c8dc','#f59e0b'];

let cur = 0;
let hinted = false;

const track  = document.getElementById('track');
const dotsW  = document.getElementById('dots-wrap');
const pname  = document.getElementById('pname');
const pnum   = document.getElementById('pnum');
const hintL  = document.getElementById('hl');
const hintR  = document.getElementById('hr');

// Build dots
for (let i = 0; i < N; i++) {
  const d = document.createElement('span');
  d.className = 'dot' + (i === 0 ? ' active' : '');
  d.dataset.i = i;
  d.onclick = () => go(i);
  dotsW.appendChild(d);
}

function go(i) {
  // Loop
  if (i < 0) i = N - 1;
  if (i >= N) i = 0;
  cur = i;

  track.style.transform = `translateX(-${cur * 100}vw)`;

  // Dots
  const allDots = dotsW.querySelectorAll('.dot');
  allDots.forEach((d, j) => {
    d.classList.toggle('active', j === cur);
    d.style.background = j === cur ? COLORS[cur] : '';
  });

  // Labels
  pname.textContent = NAMES[cur];
  pnum.textContent  = NUMS[cur] + ' / 06';

  // Hide hints after first swipe
  if (!hinted) {
    hinted = true;
    hintL.classList.add('hidden');
    hintR.classList.add('hidden');
  }
}

function done(i) {
  const el = document.getElementById('l' + i);
  if (el) el.classList.add('gone');
}

// Button nav
document.getElementById('bprev').onclick = () => go(cur - 1);
document.getElementById('bnext').onclick = () => go(cur + 1);

// Dot nav already wired above

// Keyboard
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft')  go(cur - 1);
  if (e.key === 'ArrowRight') go(cur + 1);
});

// Touch swipe detection
let sx = 0, sy = 0;

function onTS(e) {
  sx = e.touches[0].clientX;
  sy = e.touches[0].clientY;
}

function onTE(e) {
  const dx = e.changedTouches[0].clientX - sx;
  const dy = e.changedTouches[0].clientY - sy;
  // Only navigate if horizontal swipe dominates
  if (Math.abs(dx) > Math.abs(dy) * 1.2 && Math.abs(dx) > 40) {
    go(cur + (dx < 0 ? 1 : -1));
  }
}

// Listen on edges + nav bar + top bar (anything outside the iframe)
[
  document.getElementById('el'),
  document.getElementById('er'),
  document.getElementById('bot'),
  document.querySelector('.top-bar')
].forEach(el => {
  el.addEventListener('touchstart', onTS, { passive: true });
  el.addEventListener('touchend',   onTE, { passive: true });
});

// Hide hints after 4s if no swipe
setTimeout(() => {
  hintL.classList.add('hidden');
  hintR.classList.add('hidden');
}, 4000);

// Init
go(0);
</script>
</body>
</html>
