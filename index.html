<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Propuestas para Emprende Verde</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600&family=DM+Mono&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#050505;
  font-family:'Space Grotesk','Segoe UI',sans-serif}

/* ── TOP BAR ─────────────────────────────────── */
.top{
  position:fixed;top:0;left:0;right:0;height:48px;
  background:rgba(5,5,5,0.96);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid rgba(255,255,255,0.06);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 18px;z-index:200;
}
.top-name{font-size:13px;font-weight:600;color:rgba(255,255,255,0.88);
  letter-spacing:-.2px;transition:opacity .2s}
.top-num{font-family:'DM Mono',monospace;font-size:11px;
  color:rgba(255,255,255,0.28);letter-spacing:1.5px}

/* ── FRAME AREA ──────────────────────────────── */
.frame-wrap{
  position:fixed;top:48px;bottom:52px;left:0;right:0;
  overflow:hidden;background:#050505;
}

#main-frame{
  width:100%;height:100%;border:none;display:block;
  transition:opacity .22s ease;
  -webkit-overflow-scrolling:touch;overflow-y:auto;
}
#main-frame.fade{opacity:0}

/* ── LOADER ──────────────────────────────────── */
#loader{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  background:#050505;
  font-family:'DM Mono',monospace;font-size:11px;
  letter-spacing:2.5px;color:rgba(0,255,136,0.35);
  opacity:0;transition:opacity .25s;pointer-events:none;z-index:10;
}
#loader.active{opacity:1;pointer-events:all}

/* ── EDGE SWIPE ZONES ────────────────────────── */
.edge{
  position:absolute;top:0;bottom:0;width:22%;z-index:30;
  display:flex;align-items:center;cursor:pointer;
  -webkit-tap-highlight-color:transparent;
  transition:background .2s;
}
.edge-l{
  left:0;justify-content:flex-start;padding-left:10px;
  background:linear-gradient(90deg,rgba(5,5,5,.45) 0%,transparent 100%);
}
.edge-r{
  right:0;justify-content:flex-end;padding-right:10px;
  background:linear-gradient(-90deg,rgba(5,5,5,.45) 0%,transparent 100%);
}
.edge-l:active{background:linear-gradient(90deg,rgba(0,255,136,.08) 0%,transparent 100%)}
.edge-r:active{background:linear-gradient(-90deg,rgba(0,255,136,.08) 0%,transparent 100%)}
.edge-icon{
  font-size:30px;color:rgba(255,255,255,0.18);
  font-family:'DM Mono',monospace;
  transition:color .2s;user-select:none;pointer-events:none;
}
.edge:active .edge-icon{color:rgba(255,255,255,0.55)}

/* ── BOTTOM NAV ──────────────────────────────── */
.bot{
  position:fixed;bottom:0;left:0;right:0;height:52px;
  background:rgba(5,5,5,0.96);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-top:1px solid rgba(255,255,255,0.06);
  display:flex;align-items:center;justify-content:center;
  gap:10px;z-index:200;padding:0 14px;
}
.nbtn{
  background:rgba(255,255,255,0.04);
  border:1px solid rgba(255,255,255,0.1);
  color:rgba(255,255,255,0.38);
  width:34px;height:34px;border-radius:50%;
  font-size:18px;cursor:pointer;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  transition:all .2s;-webkit-tap-highlight-color:transparent;
  line-height:1;
}
.nbtn:active,.nbtn:hover{
  border-color:var(--accent,#00ff88);
  color:var(--accent,#00ff88);
  background:rgba(0,255,136,.07);
}

.dots{
  display:flex;gap:7px;align-items:center;flex:1;justify-content:center;
}
.dot{
  width:6px;height:6px;border-radius:50%;
  background:rgba(255,255,255,0.14);cursor:pointer;
  transition:all .35s cubic-bezier(.25,.46,.45,.94);
  -webkit-tap-highlight-color:transparent;
}
.dot.active{width:22px;border-radius:3px}

/* ── QR BUTTON ───────────────────────────────── */
.qr-btn{
  background:rgba(255,255,255,0.04);
  border:1px solid rgba(255,255,255,0.1);
  color:rgba(255,255,255,0.38);
  width:34px;height:34px;border-radius:50%;
  cursor:pointer;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  transition:all .2s;-webkit-tap-highlight-color:transparent;
}
.qr-btn:active,.qr-btn:hover{
  border-color:#00ff88;color:#00ff88;background:rgba(0,255,136,.07)
}
.qr-btn svg{width:16px;height:16px;fill:currentColor}

/* ── QR MODAL ────────────────────────────────── */
.modal{
  display:none;position:fixed;inset:0;
  background:rgba(0,0,0,0.88);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  z-index:500;
  align-items:center;justify-content:center;flex-direction:column;gap:18px;
}
.modal.open{display:flex;animation:fadeIn .22s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

.qr-card{
  background:#0a0a0a;
  border:1px solid rgba(255,255,255,0.08);
  border-radius:18px;padding:28px 28px 22px;
  text-align:center;
}
.qr-card img{
  width:190px;height:190px;border-radius:10px;display:block;
  background:#111;
}
.qr-url{
  font-family:'DM Mono',monospace;font-size:10px;
  letter-spacing:.5px;color:rgba(255,255,255,0.25);
  margin-top:14px;word-break:break-all;max-width:190px;line-height:1.5;
}
.qr-pitch-url{
  font-family:'DM Mono',monospace;font-size:9px;
  letter-spacing:.5px;color:rgba(0,255,136,0.35);
  margin-top:6px;word-break:break-all;max-width:190px;line-height:1.5;
}
.close-btn{
  font-family:'DM Mono',monospace;font-size:11px;letter-spacing:1.5px;
  color:rgba(255,255,255,0.28);cursor:pointer;
  padding:10px 24px;border:1px solid rgba(255,255,255,0.1);
  border-radius:100px;transition:all .2s;
  -webkit-tap-highlight-color:transparent;
}
.close-btn:active,.close-btn:hover{color:#00ff88;border-color:#00ff88}
</style>
</head>
<body>

<!-- TOP BAR -->
<div class="top">
  <span class="top-name" id="pname">Calentadores Solares</span>
  <span class="top-num"  id="pnum">01 / 06</span>
</div>

<!-- FRAME AREA -->
<div class="frame-wrap" id="wrap">
  <div id="loader">CARGANDO</div>
  <iframe id="main-frame" src="pitch1_solar_heater.html"
          title="Propuesta" scrolling="yes" onload="onLoaded()"></iframe>

  <!-- Edge swipe zones with visible arrows -->
  <div class="edge edge-l" id="el"><span class="edge-icon">‹</span></div>
  <div class="edge edge-r" id="er"><span class="edge-icon">›</span></div>
</div>

<!-- BOTTOM NAV -->
<div class="bot" id="bot">
  <button class="nbtn" id="bprev" aria-label="Anterior">‹</button>
  <div class="dots" id="dots"></div>
  <button class="nbtn" id="bnext" aria-label="Siguiente">›</button>

  <!-- QR button -->
  <button class="qr-btn" id="qr-btn" aria-label="Ver QR">
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path d="M3 3h7v7H3V3zm1 1v5h5V4H4zm1 1h3v3H5V5zM3 14h7v7H3v-7zm1 1v5h5v-5H4zm1 1h3v3H5v-3zM14 3h7v7h-7V3zm1 1v5h5V4h-5zm1 1h3v3h-3V5zm-1 9h2v2h-2v-2zm3 0h2v2h-2v-2zm-3 3h2v2h-2v-2zm3 0h2v2h-2v-2zm3-3h2v2h-2v-2zm0 3h2v2h-2v-2z"/>
    </svg>
  </button>
</div>

<!-- QR MODAL -->
<div class="modal" id="modal">
  <div class="qr-card">
    <img id="qr-img" src="" alt="QR Code">
    <div class="qr-url" id="qr-url"></div>
    <div class="qr-pitch-url" id="qr-pitch-url"></div>
  </div>
  <span class="close-btn" id="close-btn">CERRAR</span>
</div>

<script>
// ── CONFIG ───────────────────────────────────────────
const BASE = 'https://frelley.github.io/emprende-verde/';

const PITCHES = [
  'pitch1_solar_heater.html',
  'pitch2_ac_water.html',
  'pitch3_vermicompost.html',
  'pitch4_solar_dryer.html',
  'pitch5_aquaponics.html',
  'pitch6_biodigester.html',
];
const NAMES  = [
  'Calentadores Solares',
  'Agua del Aire',
  'Vermicompostaje',
  'Secadores Solares',
  'Acuaponía',
  'Biodigestores',
];
const COLORS = ['#00ff88','#00d4aa','#50dc3c','#c8e600','#00c8dc','#f59e0b'];
const N = PITCHES.length;

// ── STATE ────────────────────────────────────────────
let cur = 0;
let busy = false;

// ── ELEMENTS ─────────────────────────────────────────
const frame   = document.getElementById('main-frame');
const loader  = document.getElementById('loader');
const pname   = document.getElementById('pname');
const pnum    = document.getElementById('pnum');
const dotsEl  = document.getElementById('dots');
const modal   = document.getElementById('modal');
const qrImg   = document.getElementById('qr-img');
const qrUrl   = document.getElementById('qr-url');
const qrPitch = document.getElementById('qr-pitch-url');

// ── BUILD DOTS ───────────────────────────────────────
for (let i = 0; i < N; i++) {
  const d = document.createElement('span');
  d.className = 'dot';
  d.dataset.i = i;
  d.addEventListener('click', () => go(+d.dataset.i));
  dotsEl.appendChild(d);
}
refresh();

// ── NAVIGATION ───────────────────────────────────────
function go(i) {
  if (busy) return;
  if (i < 0) i = N - 1;   // loop back
  if (i >= N) i = 0;       // loop forward
  if (i === cur) return;
  busy = true;
  cur = i;

  frame.classList.add('fade');
  loader.classList.add('active');

  setTimeout(() => {
    frame.src = PITCHES[cur];
    refresh();
  }, 180);
}

function onLoaded() {
  frame.classList.remove('fade');
  loader.classList.remove('active');
  busy = false;
}

function refresh() {
  pname.textContent = NAMES[cur];
  pnum.textContent  = String(cur + 1).padStart(2,'0') + ' / 0' + N;
  dotsEl.querySelectorAll('.dot').forEach((d, j) => {
    const on = j === cur;
    d.classList.toggle('active', on);
    d.style.background = on ? COLORS[cur] : '';
  });
}

// ── BUTTON LISTENERS ─────────────────────────────────
document.getElementById('bprev').addEventListener('click', () => go(cur - 1));
document.getElementById('bnext').addEventListener('click', () => go(cur + 1));
document.getElementById('el').addEventListener('click', () => go(cur - 1));
document.getElementById('er').addEventListener('click', () => go(cur + 1));

// ── KEYBOARD ─────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft')  go(cur - 1);
  if (e.key === 'ArrowRight') go(cur + 1);
});

// ── TOUCH SWIPE (edges + nav bar) ───────────────────
let sx = 0, sy = 0;
function ts(e) { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }
function te(e) {
  const dx = e.changedTouches[0].clientX - sx;
  const dy = e.changedTouches[0].clientY - sy;
  if (Math.abs(dx) > Math.abs(dy) * 1.2 && Math.abs(dx) > 38) {
    go(cur + (dx < 0 ? 1 : -1));
  }
}
['el','er','bot'].forEach(id => {
  const el = document.getElementById(id);
  el.addEventListener('touchstart', ts, { passive: true });
  el.addEventListener('touchend',   te, { passive: true });
});

// ── QR CODE ───────────────────────────────────────────
document.getElementById('qr-btn').addEventListener('click', openQR);
document.getElementById('close-btn').addEventListener('click', closeQR);
modal.addEventListener('click', e => { if (e.target === modal) closeQR(); });

function openQR() {
  const mainUrl  = BASE;
  const pitchUrl = BASE + PITCHES[cur];
  const qrSrc = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(mainUrl)}&bgcolor=0a0a0a&color=00ff88&margin=8&format=png`;
  qrImg.src      = qrSrc;
  qrUrl.textContent   = mainUrl;
  qrPitch.textContent = '→ ahora: ' + NAMES[cur];
  modal.classList.add('open');
}
function closeQR() { modal.classList.remove('open'); }
</script>
</body>
</html>
